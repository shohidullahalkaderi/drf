apiVersion: v1
kind: Secret
metadata:
  name: django-secrets
  labels:
    app.kubernetes.io/name: django-app
type: Opaque
stringData:
  # [SECURITY]: Core application secret key and service credentials secured via Kubernetes Secret.
  SECRET_KEY: "django-insecure-thy^kqi^5f*lpv9)#6+ogi@b27egi4f(q3m-x=@qikk^2%!guj"
  DB_PASSWORD: "django_password"
  MYSQL_ROOT_PASSWORD: "root_password"
  REDIS_PASSWORD: "secure_password"

---
apiVersion: v1
kind: Service
metadata:
  name: app
  labels:
    io.kompose.service: app
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    io.kompose.service: app

---
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    io.kompose.service: db
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  selector:
    io.kompose.service: db

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    io.kompose.service: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    io.kompose.service: redis

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    io.kompose.service: app
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: app
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        # [SECURITY HARDENING]: Enforce RuntimeDefault seccomp profile to restrict kernel syscalls and prevent privilege escalation / kernel exploits.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: django-app
          image: django-app:dev
          # MODIFIED: Always -> IfNotPresent. Reverted for local kind/Docker
          # Desktop dev: this image is built locally and never pushed to a
          # registry, so imagePullPolicy: Always caused ErrImagePull/
          # ImagePullBackOff (kubelet tried to pull "django-app:dev" from
          # Docker Hub, which doesn't have it). IfNotPresent is correct here
          # since the cluster uses the image already loaded into its local
          # store. Switch to Always + an immutable tag (e.g. git SHA) pushed
          # to a real registry once this moves to an actual prod cluster.
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            # [SECURITY HARDENING]: Make root filesystem read-only to prevent 0-day RCE payloads from writing or modifying code/binaries.
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            # [PYTHON OPTIMIZATION/COMPATIBILITY]: Prevent Python from trying to write .pyc bytecode files to the read-only root filesystem.
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            # [PYTHON OPTIMIZATION]: Ensure logs stream instantly to container stdout without buffering.
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LOG_CHANNEL
              value: "stderr"
            - name: DB_HOST
              value: "db"
            - name: DB_NAME
              value: "django_db"
            - name: DB_USER
              value: "django_user"
            - name: DB_PORT
              value: "3306"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-secrets
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-secrets
                  key: REDIS_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: django-secrets
                  key: SECRET_KEY
          volumeMounts:
            # [SECURITY HARDENING]: Writable ephemeral storage required for runtime temp files when root filesystem is read-only.
            - mountPath: /tmp
              name: app-tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8000
            # [30-second SSE streaming setup]: Set to 35s. Since streams recycle every 30 seconds, 
            # we give it a tiny buffer past 30s before the liveness check starts.
            initialDelaySeconds: 35
            # [30-second SSE streaming setup]: 15-second intervals give worker threads enough breathing room 
            # during heavy concurrent stream requests.
            periodSeconds: 15
            timeoutSeconds: 5
            # [30-second SSE streaming setup]: A threshold of 4 means Kubelet waits 4 consecutive failures 
            # (15s * 4 = 60 seconds of unresponsiveness) before killing the pod.
            failureThreshold: 4
      restartPolicy: Always
      volumes:
        # [SECURITY HARDENING]: Ephemeral emptyDir volume for writable /tmp directory.
        - name: app-tmp
          emptyDir: {}

---
# [STATEFULSET MIGRATION]: Converted MySQL deployment to a StatefulSet for stable identities and unique per-pod storage.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  labels:
    io.kompose.service: db
spec:
  serviceName: "db"
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: db
  template:
    metadata:
      labels:
        io.kompose.service: db
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        # [SECURITY HARDENING]: Enforce RuntimeDefault seccomp profile to block unauthorized kernel system calls.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: django-mysql-db
          image: mysql:8.0
          securityContext:
            allowPrivilegeEscalation: false
            # [SECURITY HARDENING]: Make root filesystem read-only to satisfy KSV-0014 and lock down binaries.
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: MYSQL_DATABASE
              value: "django_db"
            - name: MYSQL_USER
              value: "django_user"
            - name: MYSQL_ROOT_HOST
              value: "127.0.0.1"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-secrets
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-secrets
                  key: MYSQL_ROOT_PASSWORD
          ports:
            - containerPort: 3306
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            # [PERSISTENCE]: Mount persistent volume for MySQL data files to ensure data safety across restarts.
            - mountPath: /var/lib/mysql
              name: django-db-data
            # [SECURITY HARDENING]: Ephemeral writable volume required for MySQL runtime sockets when root filesystem is read-only.
            - mountPath: /var/run/mysqld
              name: mysql-run
            # [SECURITY HARDENING]: Ephemeral writable volume required for MySQL temp files when root filesystem is read-only.
            - mountPath: /tmp
              name: mysql-tmp
      restartPolicy: Always
      volumes:
        - name: mysql-run
          emptyDir: {}
        - name: mysql-tmp
          emptyDir: {}
  # [STATEFULSET MIGRATION]: Replaced standalone PVC with volumeClaimTemplates so each replica gets an isolated disk.
  volumeClaimTemplates:
    - metadata:
        name: django-db-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
# [STATEFULSET MIGRATION]: Converted Redis deployment to a StatefulSet.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    io.kompose.service: redis
spec:
  serviceName: "redis"
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: redis
  template:
    metadata:
      labels:
        io.kompose.service: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        # [SECURITY HARDENING]: Enforce RuntimeDefault seccomp profile to lock down Redis container system calls.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: django-redis
          image: redis:7.2-alpine
          securityContext:
            allowPrivilegeEscalation: false
            # [SECURITY HARDENING]: Make root filesystem read-only to satisfy KSV-0014 and lock down binaries.
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-secrets
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          volumeMounts:
            # [PERSISTENCE]: Mount persistent volume for Redis data storage.
            - mountPath: /data
              name: redis-data
            # [SECURITY HARDENING]: Ephemeral writable volume required for Redis temporary runtime files when root filesystem is read-only.
            - mountPath: /tmp
              name: redis-tmp
      restartPolicy: Always
      volumes:
        - name: redis-tmp
          emptyDir: {}
  # [STATEFULSET MIGRATION]: Dynamic volume template for Redis.
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 500Mi