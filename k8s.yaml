apiVersion: v1
kind: Secret
metadata:
  name: django-secrets
  labels:
    app.kubernetes.io/name: django-app
type: Opaque
# NOTE: Plaintext credentials in stringData are only base64-encoded at rest,
# not encrypted. Fine for local kind/Docker Desktop, but before a real
# production apply these should come from `kubectl create secret` off an
# untracked env file, or a secrets manager (Sealed Secrets / External
# Secrets Operator / SOPS) instead of being committed here.
stringData:
  DB_PASSWORD: "django_password"
  MYSQL_ROOT_PASSWORD: "root_password"
  REDIS_PASSWORD: "secure_password"

---
apiVersion: v1
kind: Service
metadata:
  name: app
  labels:
    io.kompose.service: app
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    io.kompose.service: app

---
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    io.kompose.service: db
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  selector:
    io.kompose.service: db

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    io.kompose.service: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    io.kompose.service: redis

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    io.kompose.service: app
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: app
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: app
    spec:
      # Matches numeric UID/GID 10001 defined in the Dockerfile
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: django-app
          image: django-app:dev
          # MODIFIED: Always -> IfNotPresent. Reverted for local kind/Docker
          # Desktop dev: this image is built locally and never pushed to a
          # registry, so imagePullPolicy: Always caused ErrImagePull/
          # ImagePullBackOff (kubelet tried to pull "django-app:dev" from
          # Docker Hub, which doesn't have it). IfNotPresent is correct here
          # since the cluster uses the image already loaded into its local
          # store. Switch to Always + an immutable tag (e.g. git SHA) pushed
          # to a real registry once this moves to an actual prod cluster.
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: DB_HOST
              value: "db"
            - name: DB_NAME
              value: "django_db"
            - name: DB_USER
              value: "django_user"
            - name: DB_PORT
              value: "3306"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-secrets
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
      restartPolicy: Always

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  labels:
    io.kompose.service: db
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: db
    spec:
      # Re-added runAsNonRoot: true alongside fsGroup: 999 to pass Trivy
      # KSV-0012 while granting PVC write access to MySQL user 999
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: django-mysql-db
          image: mysql:8.0
          # No imagePullPolicy override — defaults to IfNotPresent, correct
          # for a fixed, versioned upstream tag.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: MYSQL_DATABASE
              value: "django_db"
            - name: MYSQL_USER
              value: "django_user"
            - name: MYSQL_ROOT_HOST
              value: "127.0.0.1"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-secrets
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-secrets
                  key: MYSQL_ROOT_PASSWORD
          ports:
            - containerPort: 3306
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            exec:
              # Invoked sh -c to expand $MYSQL_ROOT_PASSWORD properly during
              # liveness checks
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: django-db-data
      restartPolicy: Always
      volumes:
        - name: django-db-data
          persistentVolumeClaim:
            claimName: django-db-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: django-db-data
  labels:
    io.kompose.service: django-db-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    io.kompose.service: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: django-redis
          image: redis:7.2-alpine
          # No imagePullPolicy override — same reasoning as db.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-secrets
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          volumeMounts:
            - mountPath: /data
              name: redis-data
      restartPolicy: Always
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  labels:
    io.kompose.service: redis-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi